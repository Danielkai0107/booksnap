<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>booksnap 重設密碼</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans TC',sans-serif;color:#171717;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border-radius:12px;border:1px solid #e5e5e5;">
          <tr>
            <td style="padding:32px 24px;">
              <!-- 置於最前：手機通知預覽與長按複製 -->
              <p style="margin:0 0 20px;font-size:17px;line-height:1.5;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0.12em;color:#171717;">驗證碼 {{ .Token }}</p>

              <p style="margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-0.02em;">booksnap</p>
              <p style="margin:0 0 24px;font-size:14px;color:#737373;">教育圖書資產管理系統 · 重設密碼</p>

              <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#525252;">我們收到重設密碼的請求。請在重設密碼頁輸入上方驗證碼並設定新密碼。您也可以點擊下方按鈕（若連結被信箱預覽消耗，請改用手動輸入驗證碼）。</p>

              <p style="margin:0 0 24px;text-align:center;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 24px;background:#171717;color:#ffffff;text-decoration:none;font-size:14px;font-weight:500;border-radius:8px;">重設密碼</a>
              </p>

              <p style="margin:0;font-size:12px;line-height:1.5;color:#a3a3a3;">若您沒有申請重設密碼，可忽略此信，帳號仍會維持原密碼。</p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:11px;color:#a3a3a3;">此信寄至 {{ .Email }}</p>
      </td>
    </tr>
  </table>
</body>
</html>
